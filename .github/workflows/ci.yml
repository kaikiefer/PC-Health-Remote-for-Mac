name: Mac build and tests
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Protocol, metrics and USB tests
        run: ./scripts/test.sh
      - name: Build and package universal app
        run: ./scripts/release.sh
      - name: Upload release candidate
        uses: actions/upload-artifact@v7.0.2
        with:
          name: mac-release-candidate
          path: build/releases/*
          if-no-files-found: error
